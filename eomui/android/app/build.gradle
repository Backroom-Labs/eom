apply plugin: 'com.android.application'
def keystorePropertiesFile = rootProject.file("../../.local/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Release signing key. CI passes it in the environment (see .github/workflows/release.yml);
// local builds read .local/keystore.properties. Without either, release builds use the debug key.
def releaseStoreFile = System.getenv("ANDROID_KEYSTORE_FILE") ?: keystoreProperties['storeFile']
def hasReleaseKey = releaseStoreFile != null

android {
    namespace = "com.rubberyfun.eom"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.rubberyfun.eom"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes these for tags (eomui/scripts/android-version.mjs): -PversionName=3.5.0 -PversionCode=3050099
        versionCode((project.findProperty("versionCode") ?: "1") as Integer)
        versionName(project.findProperty("versionName") ?: "0.0.0-dev")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(releaseStoreFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: keystoreProperties['storePassword']
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: keystoreProperties['keyAlias']
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }
    // Set base archive name for both APKs and AABs
    setProperty("archivesBaseName", "eom-${defaultConfig.versionName}")

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "eom-${variant.versionName}.${variant.packageApplicationProvider.get() ? 'apk' : 'aab'}"
        }
    }
}

// Rename AAB in the release directory after bundle tasks complete
tasks.whenTaskAdded { task ->
    if (task.name == 'bundleRelease') {
        task.doLast {
            def releaseDir = file("$projectDir/release")
            if (releaseDir.exists()) {
                releaseDir.listFiles().each { file ->
                    if (file.name.endsWith('.aab')) {
                        def version = android.defaultConfig.versionName
                        def newName = "eom-${version}.aab"
                        def newFile = new File(releaseDir, newName)
                        file.renameTo(newFile)
                        println "Renamed ${file.name} to ${newName}"
                    }
                }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
