[platformio]
default_envs = esp32dev
[common]
; Pinned so every board builds with the same ESP-IDF (5.5.2). Don't move to 5.5.3: on classic ESP32
; (Atom Echo) BLE OTA loses the link (HCI 0x08) as soon as it writes flash. framework-espidf 4.x
; (e.g. 4.50505 = IDF 5.5.5) only works with platform 7.x, and newer platforms ship ESP-IDF 6, which
; drops the bundled cJSON component this project uses.
platform = espressif32@6.13.0
platform_packages = framework-espidf@3.50502
framework = espidf
upload_speed = 115200
monitor_speed = 115200
board_build.esp-idf.sdkconfig = sdkconfig.defaults
; data/config.json is compiled into the firmware and applied at boot whenever it changes;
; keys/ota_signing_pub.pem verifies OTA updates (must match EMBED_TXTFILES in src/CMakeLists.txt)
board_build.embed_txtfiles =
    data/config.json
    keys/ota_signing_pub.pem
monitor_filters =
    colorize
    esp32_exception_decoder
; gen_cert.py: generates data/server.crt + server.key (git-ignored) for the wss:// server if missing or using explicit EC parameters
; gen_signing_keys.py / sign_firmware.py: generate the OTA signing key in keys/ (git-ignored) and sign firmware.bin
; pressure_sim.py: adds the pressure simulator (-DEOM_PRESSURE_SIM) unless EOM_STABLE_RELEASE=1 (set on stable release tag builds)
; board_name.py: compiles the env name into the firmware so OTA refuses images for another board
; fs_embed_fix.py: works around a PlatformIO bug that breaks buildfs because data/config.json is embedded
extra_scripts =
    pre:tools/gen_cert.py
    pre:tools/board_name.py
    pre:tools/pressure_sim.py
    pre:tools/gen_signing_keys.py
    post:tools/sign_firmware.py
    post:tools/fs_embed_fix.py


; Other boards are commented out so only esp32dev, m5stack_atom_echo and esp32-s3-devkitm-1 build (locally and in CI).
; Uncomment an env to build it again.
[env:esp32-s3-devkitm-1]
; The Xiao ESP32-S3  from Seeed Studio is the best fit for this project but almost any esp32 board can be used
extends = common
board = seeed_xiao_esp32s3
board_build.partitions = 8mb_spiffs.csv
board_upload.flash_size = 8MB
build_flags = 
	-D PRESSURE_GPIO=ADC_CHANNEL_0 ;maps to gpio 1, labeled D0
	-D LED_GPIO=21
	-D LED_TYPE=LED_TYPE_MONO
	; -D PRESSURE_SDA=47
	; -D PRESSURE_SCL=48

;[env:adafruit_qtpy_esp32s3_nopsram]
;; Adafruit QTPY ESP32-S3 has the most features for this project if combined with the BFF
;extends = common
;board = esp32-s3-devkitm-1 #adafruit_qtpy_esp32s3_nopsram (upload bug with pio)
;board_build.partitions = 8mb_spiffs.csv
;board_upload.flash_size = 8MB
;board_build.esp-idf.sdkconfig = sdkconfig.esp32-s3-devkitm-1
;build_flags = 
;	-D PRESSURE_GPIO=ADC_CHANNEL_0 
;	-D LED_GPIO=39
;	-D LED_POWER=38
;	-D LED_TYPE=LED_TYPE_WS2812
;	-D LED_FORMAT=2
;	-D SLEEP_GPIO=0


;[env:esp32-c6-devkitm-1]
;; The Xiao ESP32-C6 is a great budget option if you don't need the features of the S3, but it only has a single ADC channel and no I2C so it's not as flexible
;extends = common
;board = esp32-c6-devkitm-1
;board_build.partitions = min_spiffs.csv
;board_upload.flash_size = 4MB
;build_flags = 
;	-D LED_GPIO=15
;	-D LED_TYPE=LED_TYPE_MONO
;	; -D PRESSURE_SDA=22
;	; -D PRESSURE_SCL=23
;; Project sources only: ESP-IDF's own files define LOG_LOCAL_LEVEL themselves
;build_src_flags =
;	-D LOG_LOCAL_LEVEL=ESP_LOG_DEBUG

;[env:waveshare_esp32_s3_amoled_1_32]
;; The Waveshare ESP32-S3 AMOLED 1.32" is a great option if you want a built in display and other features
;extends = common
;board = esp32-s3-devkitm-1
;board_build.partitions = 8mb_spiffs.csv
;board_upload.flash_size = 8MB
;build_flags = 
;	-D LED_GPIO=-1
;	-D LED_TYPE=LED_TYPE_WS2812

;[env:waveshare_esp32_s3_zero]
;; The Waveshare ESP32-S3 Zero has a built in ws2812 LED but no battery charging circuit
;extends = common
;; PlatformIO has no waveshare_esp32_s3_zero board definition; the generic S3 one works
;board = esp32-s3-devkitm-1
;board_build.partitions = min_spiffs.csv
;board_upload.flash_size = 4MB
;build_flags = 
;	-D LED_GPIO=39
;	-D LED_TYPE=LED_TYPE_WS2812

[env:native]
; Host tests, not firmware: run with `pio test -e native`. CI's firmware build skips this env.
; Each suite in test/ compiles the one src/ file it tests (its unit_under_test.c) plus its own
; fakes; ESP-IDF headers it can't avoid are stubbed in test/stubs, and cJSON comes from test/vendor
; (same version as ESP-IDF's).
platform = native
test_framework = unity
build_flags =
	-std=gnu11
	-D EOM_HOST_TEST
	-I src/include
	-I test/stubs
	-I test/vendor/cJSON
	; Linux needs libm linked explicitly (floor); macOS links it anyway.
	-lm

[env:esp32dev]
; The ESP32 DevKit is the most basic option and should work fine for offbrand boards
extends = common
board = esp32dev
debug_tool = esp-prog
board_upload.flash_size = 4MB
monitor_dtr = 0
monitor_rts = 0
board_build.partitions = min_spiffs.csv
build_flags = 
	-D LED_GPIO=2
	-D LED_TYPE=LED_TYPE_MONO

[env:m5stack_atom_echo]
; M5Stack Atom Echo (ESP32-PICO-D4, 4MB flash) used for testing. SK6812 RGB LED on G27; pressure
; sensor goes on the Grove port's G32 (ADC1 channel 4). G26 is the other Grove pin.
extends = common
board = m5stack-atom
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_flags = 
	-D PRESSURE_GPIO=ADC_CHANNEL_4
	-D LED_GPIO=27
	-D LED_TYPE=LED_TYPE_WS2812
	-D LED_FORMAT=2
	-D LED_STRIP_MODEL=LED_MODEL_SK6812
