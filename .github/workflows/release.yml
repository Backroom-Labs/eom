# Builds every PlatformIO environment. On a version tag (v2.0.1) it also publishes a GitHub release
# with firmware-<env>.bin for each one plus manifest.json (see tools/make_manifest.py), which the
# OTA paths use to find the right image. The newest release's manifest is always at
#   https://github.com/<owner>/<repo>/releases/latest/download/manifest.json
#
# Releases are signed with the OTA_SIGNING_KEY repository secret: the contents of
# keys/ota_signing_key.pem. Devices only accept updates signed with the key their firmware was
# built with, so this must be the same key as local builds. Other builds sign with a throwaway key.

name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envs:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          # native is the host test env, not firmware (see the test job).
          envs=$(sed -n 's/^\[env:\(.*\)\]$/\1/p' platformio.ini | grep -vx native | jq -R . | jq -cs .)
          echo "envs=$envs" >> "$GITHUB_OUTPUT"
          echo "Environments: $envs"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install platformio

      - run: pio test -e native

  build:
    needs: [envs, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.envs.outputs.envs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'src/idf_component.yml') }}
          restore-keys: pio-${{ matrix.env }}-

      - run: pip install platformio

      - name: Install release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::error::The OTA_SIGNING_KEY secret is not set; refusing to release firmware devices can't install."
            exit 1
          fi
          mkdir -p keys
          printf '%s\n' "$OTA_SIGNING_KEY" > keys/ota_signing_key.pem
          chmod 600 keys/ota_signing_key.pem

      - run: pio run -e ${{ matrix.env }}

      - run: |
          mkdir -p dist
          cp .pio/build/${{ matrix.env }}/firmware.bin dist/firmware-${{ matrix.env }}.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: dist/firmware-${{ matrix.env }}.bin
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true

      - name: Write manifest.json
        run: |
          tag="${GITHUB_REF_NAME}"
          python3 tools/make_manifest.py dist \
            --version "${tag#v}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # A version like 2.1.0-beta.1 is a prerelease, which releases/latest skips.
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$tag" dist/* --title "EOM ${tag#v}" --generate-notes $prerelease
