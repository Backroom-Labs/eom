# Builds every PlatformIO environment. On a version tag (v2.0.1) it also publishes firmware-<env>.bin
# for each one plus manifest.json (see tools/make_manifest.py), which the OTA paths use to find the
# right image, and the built app. They go to the public Pages site (see tools/publish_pages.sh and
# docs/adr/0011-releases-served-from-public-pages-site.md):
#   https://backroom-labs.github.io/eom/                              the app
#   https://backroom-labs.github.io/eom/firmware/manifest.json        newest stable release
#   https://backroom-labs.github.io/eom/firmware/manifest-beta.json   newest release of either kind
# The site is this repo's gh-pages branch, which the release pushes to with the workflow's own token.
# A GitHub release carries the same files as an archive.
#
# Releases are signed with the OTA_SIGNING_KEY repository secret: the contents of
# keys/ota_signing_key.pem. Devices only accept updates signed with the key their firmware was
# built with, so this must be the same key as local builds. Other builds sign with a throwaway key.
#
# The android job builds the app's APK (eom-<version>.apk), which the release carries too. Tags sign
# it with the ANDROID_KEYSTORE (base64 .jks), ANDROID_KEYSTORE_PASSWORD (store and key) and
# ANDROID_KEY_ALIAS secrets, so each release installs over the last one. Other builds use a
# throwaway debug key, and their APK is a workflow artifact.

name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envs:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          # native is the host test env, not firmware (see the test job).
          envs=$(sed -n 's/^\[env:\(.*\)\]$/\1/p' platformio.ini | grep -vx native | jq -R . | jq -cs .)
          echo "envs=$envs" >> "$GITHUB_OUTPUT"
          echo "Environments: $envs"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install platformio

      - run: pio test -e native

  # The app's type check (Svelte, Vite config, tests) and its node --test suites.
  app-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eomui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: eomui/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: node --test test/*.test.ts

  build:
    needs: [envs, test]
    runs-on: ubuntu-latest
    env:
      # Stable release tags (no "-", the same rule as the prerelease check below) leave out the pressure
      # simulator (tools/pressure_sim.py). Betas and every other build have it.
      EOM_STABLE_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.envs.outputs.envs) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'src/idf_component.yml') }}
          restore-keys: pio-${{ matrix.env }}-

      - run: pip install platformio

      - name: Install release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::error::The OTA_SIGNING_KEY secret is not set; refusing to release firmware devices can't install."
            exit 1
          fi
          mkdir -p keys
          printf '%s\n' "$OTA_SIGNING_KEY" > keys/ota_signing_key.pem
          chmod 600 keys/ota_signing_key.pem

      - run: pio run -e ${{ matrix.env }}

      - run: |
          mkdir -p dist
          cp .pio/build/${{ matrix.env }}/firmware.bin dist/firmware-${{ matrix.env }}.bin

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.env }}
          path: dist/firmware-${{ matrix.env }}.bin
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eomui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: eomui/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36

      - name: Version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/android-version.mjs "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Install release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is not set; refusing to release an app that won't install over the last one."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/eom-release.jks"
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: web-app
          path: eomui/public
          if-no-files-found: error

      - run: npx cap sync android

      - name: Build APK
        working-directory: eomui/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
        run: |
          # Without ANDROID_KEYSTORE_FILE (set on tags only) the APK is signed with the debug key.
          version_args=()
          if [ -n "$VERSION_NAME" ]; then
            version_args=(-PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE")
          fi
          ./gradlew assembleRelease "${version_args[@]}"
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/eom-*.apk ../../dist/

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/eom-*.apk
          if-no-files-found: error

  release:
    needs: [build, android, app-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PAGES_BRANCH: gh-pages
      PAGES_URL: https://backroom-labs.github.io/eom
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: web-app
          path: app

      - name: Write manifest.json
        run: |
          tag="${GITHUB_REF_NAME}"
          python3 tools/make_manifest.py dist \
            --version "${tag#v}" \
            --base-url "${PAGES_URL}/firmware/${tag#v}"

      - name: Publish to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Another release may push meanwhile; then start again from its commit.
          for attempt in 1 2 3; do
            rm -rf site
            if ! git clone -q --depth 1 --branch "$PAGES_BRANCH" "$remote" site; then
              echo "::error::Couldn't clone the ${PAGES_BRANCH} branch; it must exist before a release."
              exit 1
            fi
            tools/publish_pages.sh site "$version" dist app
            git -C site add -A
            if git -C site diff --cached --quiet; then
              echo "Pages already has $version"
              exit 0
            fi
            git -C site -c user.name="github-actions[bot]" \
                -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "EOM $version"
            git -C site push -q origin "HEAD:${PAGES_BRANCH}" && exit 0
          done
          echo "::error::Couldn't push $version to ${PAGES_BRANCH}."
          exit 1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # A version like 2.1.0-beta.1 is a prerelease, which releases/latest skips.
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$tag" dist/* --title "EOM ${tag#v}" --generate-notes $prerelease
